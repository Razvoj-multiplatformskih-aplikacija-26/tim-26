name: cartmap_mobile
description: CartMap - mobilna aplikacija za kupce.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  go_router: ^18.0.2
  api_client:
    path: ../../packages/api_client
  domain:
    path: ../../packages/domain
  use_cases:
    path: ../../packages/use_cases
  blocs:
    path: ../../packages/blocs
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/FredokaOne-Regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: '#2E7D32'
  adaptive_icon_foreground: assets/icon/icon_foreground.png
